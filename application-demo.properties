# Profil de démonstration complet : base H2 en mémoire + sécurité assouplie.
# Lancer avec : mvnw spring-boot:run -Dspring-boot.run.profiles=demo
# Utile pour explorer l'application sans serveur MySQL ni écran de connexion.
server.port=8989
spring.application.name=Systeme__Gestion__Bibliotheque

# Base H2 en mémoire (recréée à chaque démarrage)
spring.datasource.url=jdbc:h2:mem:gestion_bibliotheque;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crée le schéma depuis les entités JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 pratique pour l'inspection : http://localhost:8989/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.data=WARN

