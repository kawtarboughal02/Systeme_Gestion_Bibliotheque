<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.com"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/lux/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
    <title>Liste des Livres Empruntés</title>
</head>
<body>
<!-- Nav BAR -->
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#" style="color: white; font-weight: bold;">Système de Gestion de Bibliothéque</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarColor01" style="margin-left:120px">
            <ul class="navbar-nav me-auto">

                <a th:href="@{/ouvrages}">
                    <button type="button" class="btn btn-primary">Catalogue</button>
                </a>
                <a th:href="@{/ouvrages/emprunts}">
                    <button type="button" class="btn btn-primary">Livres Empruntés</button>
                </a>

                <a th:href="@{/reservation}">
                    <button type="button" class="btn btn-primary">Réservations</button>
                </a>

                <a th:href="@{/listeadherents}">
                    <button type="button" class="btn btn-primary">Liste des adhérents</button>
                </a>

                <a th:href="@{/listedemandeadherent}">
                    <button type="button" class="btn btn-primary">Liste Demande Adhésion</button>
                </a>
                <a th:href="@{/login}">
                    <button type="button" class="btn btn-success" style="margin-left:100px;width:150px;">Log out</button>
                </a>
            </ul>

        </div>
    </div>
</nav>
<!-- End Nav Bar -->
<style>
    body{
         background-image: url('/images/livres.png');
    }
</style>
<div class="container">
    <div class="card" style="margin-top:50px;height:90px;background:black;">
        <h2 style="margin-top:20px;text-align:center;color:white;"><b>Liste Des Livres Empruntés</b></h2>
    </div>
    <div class="card">
        <div class="card-body" style="height:80px">
            <div class="row">
                <div class="col-md-6">
                    <a href="/ouvrages/emprunterForm?ouvrageId=1" class="btn btn-info">Ajouter un Emprunts</a>
                </div>
                <div class="col-md-6 text-right">
                    <form class="form-inline" th:action="@{/ouvrages/recherche}" method="get">
                        <div class="form-group mb-2">
                            <input type="text" class="form-control" name="q" placeholder="Chercher">
                        </div>
                        <button type="submit" class="btn btn-primary mb-2">Chercher</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="card">
        <div class="card-body">
            <table class="table table-striped table-dark">
                <thead>
                <tr>
                    <th scope="col"style="text-align:center;">Nom Emprunteur</th>
                    <th scope="col"style="text-align:center;">Prénom Emprunteur</th>
                    <th scope="col"style="text-align:center;">Titre</th>
                    <th scope="col"style="text-align:center;">Auteur</th>
                    <th scope="col"style="text-align:center;">Date Demande</th>
                    <th scope="col"style="text-align:center;">Date Retour</th>
                    <th scope="col"style="text-align:center;">Modifier</th>
                    <th scope="col"style="text-align:center;">Confirme un Retour</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emprunt : ${emprunts}" style="text-align:center;">
                    <td th:text="${emprunt.nomEmprunteur}"></td>
                    <td th:text="${emprunt.prenomEmprunteur}"></td>
                    <td th:text="${emprunt.ouvrage.titre}"></td>
                    <td th:text="${emprunt.ouvrage.auteur}"></td>
                    <td th:text="${emprunt.dateDemande}"></td>
                    <td th:text="${emprunt.dateRetour}"></td>
                    <td>
                        <a th:href="@{/ouvrages/emprunts/modifier/{id}(id=${emprunt.id})}" class="btn btn-success btn-sm">Modifier un Emprunts</a>
                    </td>
                    <td>
                        <a th:href="@{'/retour/' + ${emprunt.id} + '/valider'}" class="btn btn-danger btn-sm">Valider Retour</a>
                    </td>
                </tr>


                </tbody>
            </table>
            <div>
                <ul class="pagination">
                    <li class="page-item disabled">
                        <a class="page-link" href="#">&laquo;</a>
                    </li>
                    <li class="page-item active">
                        <a class="page-link" href="#">1</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">2</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">3</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">4</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">5</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">&raquo;</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
</body>
</html>
