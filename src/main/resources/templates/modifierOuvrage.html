<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.com">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/lux/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
    <title>Modifier un Livre</title>
</head>
<body>
<!-- Nav BAR -->
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#" style="color: white; font-weight: bold;">Système de Gestion de Bibliothéque</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarColor01" style="margin-left:120px">
            <ul class="navbar-nav me-auto">

                <a th:href="@{/ouvrages}">
                    <button type="button" class="btn btn-primary">Catalogue</button>
                </a>
                <a th:href="@{/ouvrages/emprunts}">
                    <button type="button" class="btn btn-primary">Livres Empruntés</button>
                </a>

                <a th:href="@{/reservation}">
                    <button type="button" class="btn btn-primary">Réservations</button>
                </a>

                <a th:href="@{/listeadherents}">
                    <button type="button" class="btn btn-primary">Liste des adhérents</button>
                </a>

                <a th:href="@{/listedemandeadherent}">
                    <button type="button" class="btn btn-primary">Liste Demande Adhésion</button>
                </a>
                <a th:href="@{/login}">
                    <button type="button" class="btn btn-success" style="margin-left:100px;width:150px;">Log out</button>
                </a>
            </ul>

        </div>
    </div>
</nav>
<!-- End Nav Bar -->
<section class="vh-100" style="background-image: url('/images/livres.png');">
    <div class="container py -3 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col col-xl-60">
                <div class="card" style="border-radius: 1rem;">
                    <div class="row g-0">
                        <div class="col-md-6 col-lg-5 d-none d-md-block">
                            <img src="/images/girlBibliotheque.png"
                                 alt="Bibliothéque" class="img-fluid" style="border-radius: 1rem 0 0 1rem; width:150%; height:100%;" />
                        </div>
                        <div class="col-md-6 col-lg-7 d-flex align-items-center">
                            <div class="card-body p-4 p-lg-5 text-black" style="overflow-y: auto; max-height: 80vh;">

                                <form th:action="@{/enregistrer}" method="post" th:object="${ouvrage}">
                                    <h5 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;text-align: center;">Modifier un Livre</h5>

                                    <div data-mdb-input-init class="form-outline mb-4">
                                        <input type="hidden" th:field="*{id}" />
                                    </div>

                                    <div data-mdb-input-init class="form-outline mb-4">
                                        <label class="form-label" for="auteur">Auteur</label>
                                        <input type="text" id="auteur" name="auteur" th:field="*{auteur}" placeholder="Entrer Auteur de Livre" class="form-control" />
                                    </div>

                                    <div data-mdb-input-init class="form-outline mb-4">
                                        <label class="form-label" for="titre">Titre de Livre</label>
                                        <input type="text" id="titre" name="titre" th:field="*{titre}" placeholder="Entrer votre Titre de Livre" class="form-control" />
                                    </div>

                                    <div data-mdb-input-init class="form-outline mb-4">
                                        <label class="form-label" for="categorie">Catégorie </label>
                                        <input type="text" id="categorie" name="categorie" th:field="*{categorie}" placeholder="Entrer votre Type de Catégorie" class="form-control" />
                                    </div>

                                    <div data-mdb-input-init class="form-outline mb-4">
                                        <label class="form-label" for="isbn">ISBN</label>
                                        <input type="text" id="isbn" name="isbn" th:field="*{isbn}" placeholder="Entrer votre ISBN" class="form-control" />
                                    </div>

                                    <div data-mdb-input-init class="form-outline mb-4">
                                        <label class="form-label" for="date_edition">Date Edition:</label>
                                        <input type="date" id="date_edition" name="date_edition" th:field="*{date_edition}" placeholder="Entrer votre Date de l'Edition" class="form-control" />
                                    </div>

                                    <div data-mdb-input-init class="form-outline mb-4">
                                        <label class="form-label" for="quantité">Quantité</label>
                                        <input type="number" id="quantité" name="quantité" th:field="*{quantité}" placeholder="Entrer votre Quantité" class="form-control" />
                                    </div>

                                    <div class="pt-1 mb-4 d-flex justify-content-center align-items-center">
                                        <button type="submit" class="btn btn-info">Modifier un Livre</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>
</body>
</html>
