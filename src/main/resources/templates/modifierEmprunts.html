<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.com">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/lux/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
    <title>Modifier un Emprunt</title>
</head>
<body>
<!-- Nav BAR -->
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#" style="color: white; font-weight: bold;">Système de Gestion de Bibliothéque</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarColor01" style="margin-left:120px">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="btn btn-primary" th:href="@{/ouvrages}">Catalogue</a></li>
                <li class="nav-item"><a class="btn btn-primary" th:href="@{/ouvrages/emprunts}">Livres Empruntés</a></li>
                <li class="nav-item"><a class="btn btn-primary" th:href="@{/reservation}">Réservations</a></li>
                <li class="nav-item"><a class="btn btn-primary" th:href="@{/listeadherents}">Liste des adhérents</a></li>
                <li class="nav-item"><a class="btn btn-primary" th:href="@{/listedemandeadherent}">Liste Demande Adhésion</a></li>
                <li class="nav-item"><a class="btn btn-success" th:href="@{/login}" style="margin-left:100px;width:150px;">Log out</a></li>
            </ul>
        </div>
    </div>
</nav>
<!-- End Nav Bar -->
<section class="vh-100" style="background-image: url('/images/livres.png');">
    <div class="container py-3 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col col-xl-60">
                <div class="card" style="border-radius: 1rem;">
                    <div class="row g-0">
                        <div class="col-md-6 col-lg-5 d-none d-md-block">
                            <img src="/images/girlBibliotheque.png" alt="Bibliothéque" class="img-fluid" style="border-radius: 1rem 0 0 1rem; width:150%; height:100%;" />
                        </div>
                        <div class="col-md-6 col-lg-7 d-flex align-items-center">
                            <div class="card-body p-4 p-lg-5 text-black" style="overflow-y: auto; max-height: 80vh;">
                                <form th:action="@{/ouvrages/emprunts/modifier/{id}(id=${emprunt.id})}" method="post" th:object="${emprunt}">
                                    <h5 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;text-align: center;">Modifier un Emprunt</h5>
                                    <input type="hidden" th:field="*{ouvrage.id}" />
                                    <div class="form-outline mb-4">
                                        <label class="form-label">Titre de Livre</label>
                                        <input type="text" th:field="*{ouvrage.titre}" placeholder="Entrer le Titre de Livre" class="form-control" />
                                    </div>
                                    <div class="form-outline mb-4">
                                        <label class="form-label">Nom de l'emprunteur</label>
                                        <input type="text" th:field="*{nomEmprunteur}" placeholder="Entrer le Nom de l'emprunteur" class="form-control" />
                                    </div>
                                    <div class="form-outline mb-4">
                                        <label class="form-label">Prénom de l'emprunteur</label>
                                        <input type="text" th:field="*{prenomEmprunteur}" placeholder="Entrer le Prénom de l'emprunteur" class="form-control" />
                                    </div>
                                    <div class="form-outline mb-4">
                                        <label class="form-label">Date de La Demande</label>
                                        <input type="date" th:field="*{dateDemande}" placeholder="Entrer la Date de La Demande" class="form-control" />
                                    </div>
                                    <div class="form-outline mb-4">
                                        <label class="form-label">Date de Retour</label>
                                        <input type="date" th:field="*{dateRetour}" placeholder="Entrer la Date de Retour" class="form-control" />
                                    </div>
                                    <div class="pt-1 mb-4 d-flex justify-content-center align-items-center">
                                        <button type="submit" class="btn btn-info">Modifier un Emprunt</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
